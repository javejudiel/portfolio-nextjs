<svg width="1600" height="1040" viewBox="0 0 1600 1040" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1040" rx="32" fill="#07101D"/>
  <circle cx="1250" cy="260" r="300" fill="#2A7FFF" opacity="0.14"/>
  <circle cx="360" cy="760" r="300" fill="#27C2B8" opacity="0.09"/>

  <style>
    .title{font:800 42px Arial,sans-serif;fill:#F8FBFF}
    .subtitle{font:400 20px Arial,sans-serif;fill:#AFC1D8}
    .label{font:800 22px Arial,sans-serif;fill:#F8FBFF}
    .small{font:400 17px Arial,sans-serif;fill:#BFD0E5}
    .tiny{font:700 15px Arial,sans-serif;fill:#8AA2FF}
    .pill{font:700 15px Arial,sans-serif;fill:#DDE7F6}
    .note{font:400 16px Arial,sans-serif;fill:#AFC1D8}
  </style>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#5C8DFF"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#5EE0D0"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#A98CFF"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#F6B74D"/></marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#8A99AD"/></marker>
  </defs>

  <text x="72" y="76" class="title">Ride-Hailing Platform Architecture</text>
  <text x="72" y="114" class="subtitle">Simplified for portfolio use. Focused on booking APIs, routing, driver matching, geospatial data, and real-time state.</text>

  <rect x="80" y="190" width="310" height="280" rx="22" fill="#172033" stroke="#5C8DFF" stroke-width="2" filter="url(#shadow)"/>
  <text x="114" y="228" class="tiny">01</text>
  <text x="114" y="268" class="label">Client Apps</text>
  <text x="114" y="312" class="small">Passenger booking interface</text>
  <text x="114" y="341" class="small">Driver status and trip updates</text>
  <text x="114" y="370" class="small">Responsive React / Next.js UI</text>
  <rect x="114" y="404" width="150" height="34" rx="17" fill="rgba(255,255,255,0.08)"/>
  <text x="145" y="426" class="pill">Frontend</text>

  <rect x="505" y="175" width="330" height="310" rx="24" fill="#201532" stroke="#A98CFF" stroke-width="2" filter="url(#shadow)"/>
  <text x="539" y="213" class="tiny">02</text>
  <text x="539" y="253" class="label">Gateway &amp; Routing</text>
  <text x="539" y="297" class="small">Next.js route handling</text>
  <text x="539" y="326" class="small">Request validation</text>
  <text x="539" y="355" class="small">API routing boundaries</text>
  <text x="539" y="384" class="small">Frontend/backend handoff</text>
  <rect x="539" y="420" width="156" height="34" rx="17" fill="rgba(255,255,255,0.08)"/>
  <text x="572" y="442" class="pill">Next.js</text>

  <rect x="950" y="170" width="390" height="240" rx="22" fill="#102D2E" stroke="#5EE0D0" stroke-width="2" filter="url(#shadow)"/>
  <text x="984" y="208" class="tiny">03</text>
  <text x="984" y="248" class="label">Booking API Service</text>
  <text x="984" y="292" class="small">Booking request APIs</text>
  <text x="984" y="321" class="small">User and trip management</text>
  <text x="984" y="350" class="small">Route and driver suggestion flow</text>

  <rect x="950" y="470" width="390" height="250" rx="22" fill="#0B1830" stroke="#5C8DFF" stroke-width="2" filter="url(#shadow)"/>
  <text x="984" y="508" class="tiny">04</text>
  <text x="984" y="548" class="label">Driver Matching</text>
  <text x="984" y="577" class="label">&amp; Location Service</text>
  <text x="984" y="621" class="small">Real-time driver availability</text>
  <text x="984" y="650" class="small">Matching and route logic</text>
  <text x="984" y="679" class="small">Location-aware booking decisions</text>

  <rect x="505" y="610" width="330" height="250" rx="22" fill="#2C1D0F" stroke="#F6B74D" stroke-width="2" filter="url(#shadow)"/>
  <text x="539" y="648" class="tiny">05</text>
  <text x="539" y="688" class="label">AI Assistance</text>
  <text x="539" y="717" class="label">Service</text>
  <text x="539" y="761" class="small">Route and driver suggestions</text>
  <text x="539" y="790" class="small">Natural-language assistance</text>
  <text x="539" y="819" class="small">Booking support workflows</text>

  <rect x="100" y="640" width="310" height="210" rx="22" fill="#112A32" stroke="#5EE0D0" stroke-width="2" filter="url(#shadow)"/>
  <text x="134" y="678" class="tiny">06</text>
  <text x="134" y="718" class="label">Real-time State</text>
  <text x="134" y="762" class="small">Driver availability cache</text>
  <text x="134" y="791" class="small">Trip state and quick lookups</text>
  <text x="134" y="820" class="small">Redis-backed live updates</text>

  <rect x="960" y="820" width="360" height="140" rx="22" fill="#172033" stroke="#8FA2BA" stroke-width="2" filter="url(#shadow)"/>
  <text x="994" y="858" class="tiny">07</text>
  <text x="994" y="898" class="label">PostgreSQL / PostGIS</text>
  <text x="994" y="936" class="small">Users, bookings, trips, locations</text>

  <path d="M390 330H491" stroke="#5C8DFF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M835 330H936" stroke="#5C8DFF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M1145 410V456" stroke="#5C8DFF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M1145 720V806" stroke="#8A99AD" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>
  <path d="M950 560H670V596" stroke="#F6B74D" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <path d="M505 735H424" stroke="#5EE0D0" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <path d="M835 735H900V390H936" stroke="#F6B74D" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowAmber)"/>
  <path d="M1340 290H1460V890H1324" stroke="#8A99AD" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>

  <rect x="414" y="288" width="78" height="32" rx="16" fill="#0F1D31"/>
  <text x="431" y="310" class="tiny">Request</text>
  <rect x="860" y="288" width="74" height="32" rx="16" fill="#0F1D31"/>
  <text x="878" y="310" class="tiny">Route</text>
  <rect x="1172" y="431" width="86" height="32" rx="16" fill="#0F1D31"/>
  <text x="1190" y="453" class="tiny">Match</text>
  <rect x="690" y="518" width="86" height="32" rx="16" fill="#2B1C10"/>
  <text x="708" y="540" class="tiny">Assist</text>
  <rect x="424" y="696" width="74" height="32" rx="16" fill="#102A2B"/>
  <text x="442" y="718" class="tiny">Cache</text>
  <rect x="1166" y="740" width="92" height="32" rx="16" fill="#121E31"/>
  <text x="1184" y="762" class="tiny">Persist</text>

  <rect x="72" y="982" width="1456" height="42" rx="12" fill="#0A1321" stroke="#223149"/>
  <line x1="98" y1="1004" x2="150" y2="1004" stroke="#5C8DFF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="164" y="1010" class="note">Client booking flow</text>
  <line x1="390" y1="1004" x2="442" y2="1004" stroke="#5EE0D0" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <text x="456" y="1010" class="note">Real-time update flow</text>
  <line x1="690" y1="1004" x2="742" y2="1004" stroke="#F6B74D" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <text x="756" y="1010" class="note">AI assistance flow</text>
  <line x1="980" y1="1004" x2="1032" y2="1004" stroke="#8A99AD" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>
  <text x="1046" y="1010" class="note">Database persistence</text>
</svg>

<svg width="1600" height="1040" viewBox="0 0 1600 1040" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1040" rx="32" fill="#07101D"/>
  <circle cx="310" cy="270" r="280" fill="#5C8DFF" opacity="0.12"/>
  <circle cx="1240" cy="720" r="310" fill="#27C2B8" opacity="0.10"/>

  <style>
    .title{font:800 42px Arial,sans-serif;fill:#F8FBFF}
    .subtitle{font:400 20px Arial,sans-serif;fill:#AFC1D8}
    .label{font:800 22px Arial,sans-serif;fill:#F8FBFF}
    .small{font:400 17px Arial,sans-serif;fill:#BFD0E5}
    .tiny{font:700 15px Arial,sans-serif;fill:#8AA2FF}
    .pill{font:700 15px Arial,sans-serif;fill:#DDE7F6}
    .note{font:400 16px Arial,sans-serif;fill:#AFC1D8}
  </style>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#5C8DFF"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#5EE0D0"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#F6B74D"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#A98CFF"/></marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#8A99AD"/></marker>
  </defs>

  <text x="72" y="76" class="title">Library Management System Architecture</text>
  <text x="72" y="114" class="subtitle">Simplified for portfolio use. Focused on catalog management, borrowing workflows, payments, and Laravel API data flow.</text>

  <rect x="90" y="200" width="330" height="245" rx="22" fill="#172033" stroke="#5C8DFF" stroke-width="2" filter="url(#shadow)"/>
  <text x="124" y="238" class="tiny">01</text>
  <text x="124" y="278" class="label">Member Portal</text>
  <text x="124" y="322" class="small">Search book catalog</text>
  <text x="124" y="351" class="small">View borrowed books</text>
  <text x="124" y="380" class="small">Pay fines or account balance</text>

  <rect x="90" y="575" width="330" height="245" rx="22" fill="#201532" stroke="#A98CFF" stroke-width="2" filter="url(#shadow)"/>
  <text x="124" y="613" class="tiny">02</text>
  <text x="124" y="653" class="label">Librarian Admin</text>
  <text x="124" y="697" class="small">Book and member records</text>
  <text x="124" y="726" class="small">Borrowing and return actions</text>
  <text x="124" y="755" class="small">Fine and payment monitoring</text>

  <rect x="570" y="335" width="420" height="330" rx="24" fill="#102D2E" stroke="#5EE0D0" stroke-width="2" filter="url(#shadow)"/>
  <text x="604" y="373" class="tiny">03</text>
  <text x="604" y="413" class="label">Laravel API</text>
  <text x="604" y="457" class="small">Authentication and user roles</text>
  <text x="604" y="486" class="small">Catalog, member, and loan APIs</text>
  <text x="604" y="515" class="small">Borrowing and return validation</text>
  <text x="604" y="544" class="small">Fine calculation and payment records</text>
  <rect x="604" y="583" width="152" height="34" rx="17" fill="rgba(255,255,255,0.08)"/>
  <text x="647" y="605" class="pill">Laravel</text>

  <rect x="1130" y="210" width="340" height="225" rx="22" fill="#0B1830" stroke="#5C8DFF" stroke-width="2" filter="url(#shadow)"/>
  <text x="1164" y="248" class="tiny">04</text>
  <text x="1164" y="288" class="label">MySQL Database</text>
  <text x="1164" y="332" class="small">Books, copies, and categories</text>
  <text x="1164" y="361" class="small">Members and librarians</text>
  <text x="1164" y="390" class="small">Loans, returns, fines, payments</text>

  <rect x="1110" y="560" width="390" height="250" rx="22" fill="#2C1D0F" stroke="#F6B74D" stroke-width="2" filter="url(#shadow)"/>
  <text x="1144" y="598" class="tiny">05</text>
  <text x="1144" y="638" class="label">Payment Gateway</text>
  <text x="1144" y="682" class="small">Secure mobile wallet integration</text>
  <text x="1144" y="711" class="small">Automated payment confirmation</text>
  <text x="1144" y="740" class="small">and webhooks</text>
  <text x="1144" y="769" class="small">Real-time fine and account balance updates</text>

  <rect x="570" y="790" width="540" height="165" rx="22" fill="#112A32" stroke="#5EE0D0" stroke-width="2" filter="url(#shadow)"/>
  <text x="604" y="828" class="tiny">06</text>
  <text x="604" y="868" class="label">Borrowing Workflow</text>
  <text x="604" y="912" class="small">Issue books, receive returns, track due dates</text>
  <text x="604" y="941" class="small">and fines</text>

  <path d="M250 445V500H556" stroke="#5C8DFF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M250 575V545H556" stroke="#A98CFF" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <path d="M990 400H1116" stroke="#8A99AD" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>
  <path d="M990 600H1096" stroke="#F6B74D" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <path d="M780 665V776" stroke="#5EE0D0" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <rect x="1010" y="354" width="88" height="32" rx="16" fill="#121E31"/>
  <text x="1027" y="376" class="tiny">Persist</text>
  <rect x="1012" y="558" width="86" height="32" rx="16" fill="#2B1C10"/>
  <text x="1030" y="580" class="tiny">Pay</text>
  <rect x="810" y="706" width="94" height="32" rx="16" fill="#102A2B"/>
  <text x="828" y="728" class="tiny">Loans</text>

  <rect x="72" y="982" width="1456" height="42" rx="12" fill="#0A1321" stroke="#223149"/>
  <line x1="98" y1="1004" x2="150" y2="1004" stroke="#5C8DFF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="164" y="1010" class="note">Member API flow</text>
  <line x1="370" y1="1004" x2="422" y2="1004" stroke="#A98CFF" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="436" y="1010" class="note">Admin workflow</text>
  <line x1="630" y1="1004" x2="682" y2="1004" stroke="#F6B74D" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <text x="696" y="1010" class="note">Payment gateway flow</text>
  <line x1="960" y1="1004" x2="1012" y2="1004" stroke="#8A99AD" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>
  <text x="1026" y="1010" class="note">Database persistence</text>
</svg>

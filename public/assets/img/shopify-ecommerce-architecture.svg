  <text x="72" y="76" class="title">Shopify Storefront Integration Architecture</text>
  <text x="72" y="114" class="subtitle">Simplified for portfolio use. Focused on theme customization, Shopify data, cart/checkout flow, apps, and storefront optimization.</text>


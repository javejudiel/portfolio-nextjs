  <path d="M1120 385H1030V710H974" stroke="#8A99AD" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>

  <rect x="452" y="282" width="90" height="32" rx="16" fill="#0F1D31"/>

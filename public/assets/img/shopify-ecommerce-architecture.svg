  <text x="119" y="283" class="label">Customer Browser</text>
  <text x="119" y="327" class="small">Product discovery</text>
  <text x="119" y="356" class="small">Cart interactions</text>
  <text x="119" y="385" class="small">Mobile shopping flow</text>

  <rect x="555" y="185" width="430" height="310" rx="24" fill="#102D2E" stroke="#5EE0D0" stroke-width="2" filter="url(#shadow)"/>
  <text x="589" y="223" class="tiny">02</text>
  <text x="589" y="263" class="label">Custom Shopify Theme</text>
  <text x="589" y="307" class="small">Liquid templates and sections</text>
  <text x="589" y="336" class="small">Reusable content blocks</text>

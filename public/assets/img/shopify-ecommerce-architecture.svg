  <text x="1154" y="380" class="small">Orders and customers</text>
  <text x="1154" y="409" class="small">Store settings and content</text>

  <rect x="120" y="610" width="350" height="220" rx="22" fill="#201532" stroke="#A98CFF" stroke-width="2" filter="url(#shadow)"/>

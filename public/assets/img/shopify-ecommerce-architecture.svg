  <text x="634" y="801" class="small">Shipping/payment app integrations</text>

  <rect x="1110" y="610" width="380" height="230" rx="22" fill="#112A32" stroke="#5EE0D0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1144" y="648" class="tiny">06</text>
  <text x="1144" y="688" class="label">Optimization Layer</text>

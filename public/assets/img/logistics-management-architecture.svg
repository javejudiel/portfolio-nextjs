<svg width="1600" height="1040" viewBox="0 0 1600 1040" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1040" rx="32" fill="#07101D"/>
  <circle cx="280" cy="270" r="260" fill="#2A7FFF" opacity="0.12"/>
  <circle cx="1280" cy="730" r="300" fill="#27C2B8" opacity="0.10"/>

  <style>
    .title{font:800 42px Arial,sans-serif;fill:#F8FBFF}
    .subtitle{font:400 20px Arial,sans-serif;fill:#AFC1D8}
    .label{font:800 22px Arial,sans-serif;fill:#F8FBFF}
    .small{font:400 17px Arial,sans-serif;fill:#BFD0E5}
    .tiny{font:700 15px Arial,sans-serif;fill:#8AA2FF}
    .pill{font:700 15px Arial,sans-serif;fill:#DDE7F6}
    .note{font:400 16px Arial,sans-serif;fill:#AFC1D8}
  </style>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#5C8DFF"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#5EE0D0"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#F6B74D"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#A98CFF"/></marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10V2Z" fill="#8A99AD"/></marker>
  </defs>

  <text x="72" y="76" class="title">Logistics Management System Architecture</text>
  <text x="72" y="114" class="subtitle">Simplified for portfolio use. Focused on marketplace orders, confirmation automation, ERP workflows, inventory, and delivery tracking.</text>

  <rect x="90" y="200" width="315" height="220" rx="22" fill="#172033" stroke="#5C8DFF" stroke-width="2" filter="url(#shadow)"/>
  <text x="124" y="238" class="tiny">01</text>
  <text x="124" y="278" class="label">Marketplace Shops</text>
  <text x="124" y="322" class="small">Lazada orders</text>
  <text x="124" y="351" class="small">TikTok Shop orders</text>
  <text x="124" y="380" class="small">Shopee orders</text>

  <rect x="540" y="185" width="390" height="300" rx="24" fill="#102D2E" stroke="#5EE0D0" stroke-width="2" filter="url(#shadow)"/>
  <text x="574" y="223" class="tiny">02</text>
  <text x="574" y="263" class="label">Logistics Management</text>
  <text x="574" y="292" class="label">System</text>
  <text x="574" y="334" class="small">Displays incoming marketplace orders</text>
  <text x="574" y="363" class="small">Manual confirmation under 3 hours</text>
  <text x="574" y="392" class="small">Auto-confirms after 3 hours</text>
  <text x="574" y="421" class="small">Monitors courier delivery status</text>
  <rect x="574" y="438" width="168" height="34" rx="17" fill="rgba(255,255,255,0.08)"/>
  <text x="607" y="460" class="pill">Order Hub</text>

  <rect x="1065" y="185" width="370" height="245" rx="22" fill="#2C1D0F" stroke="#F6B74D" stroke-width="2" filter="url(#shadow)"/>
  <text x="1099" y="223" class="tiny">03</text>
  <text x="1099" y="263" class="label">ERP / Sales Order</text>
  <text x="1099" y="307" class="small">Creates sales orders after confirmation</text>
  <text x="1099" y="336" class="small">Receives confirmed marketplace demand</text>
  <text x="1099" y="365" class="small">Shares business data through ERP DB</text>

  <rect x="102" y="560" width="340" height="220" rx="22" fill="#241833" stroke="#A98CFF" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="598" class="tiny">04</text>
  <text x="136" y="638" class="label">ERP Database</text>
  <text x="136" y="682" class="small">Shared source of truth</text>
  <text x="136" y="711" class="small">Used by ERP, inventory, and MES</text>
  <text x="136" y="740" class="small">Different processes and departments</text>

  <rect x="540" y="555" width="395" height="260" rx="22" fill="#112A32" stroke="#5EE0D0" stroke-width="2" filter="url(#shadow)"/>
  <text x="574" y="593" class="tiny">06</text>
  <text x="574" y="633" class="label">Inventory System</text>
  <text x="574" y="677" class="small">Receives ready item updates from MES</text>
  <text x="574" y="706" class="small">Users confirm ready for delivery</text>
  <text x="574" y="735" class="small">Updates LMS as Ready to Ship</text>
  <text x="574" y="764" class="small">Updates shipped status and stocks</text>

  <rect x="1040" y="575" width="360" height="230" rx="22" fill="#0B1830" stroke="#5C8DFF" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074" y="613" class="tiny">05</text>
  <text x="1074" y="653" class="label">MES Workflow</text>
  <text x="1074" y="697" class="small">Creates work order after confirmation</text>
  <text x="1074" y="726" class="small">Tracks manufacturing processing</text>
  <text x="1074" y="755" class="small">Marks item ready after completion</text>

  <rect x="540" y="860" width="395" height="90" rx="22" fill="#172033" stroke="#8FA2BA" stroke-width="2" filter="url(#shadow)"/>
  <text x="574" y="898" class="tiny">07</text>
  <text x="574" y="938" class="label">Courier Delivery Tracking</text>

  <path d="M405 310H526" stroke="#5C8DFF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M930 310H1051" stroke="#F6B74D" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <path d="M1250 430V561" stroke="#5C8DFF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M1040 690H949" stroke="#5EE0D0" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <path d="M738 815V846" stroke="#5EE0D0" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <path d="M728 555V489" stroke="#5EE0D0" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <path d="M828 555V489" stroke="#5EE0D0" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowTeal)"/>
  <path d="M272 560V510H735V489" stroke="#A98CFF" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowPurple)"/>
  <path d="M442 670H526" stroke="#A98CFF" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowPurple)"/>
  <path d="M442 750H500V850H1220V819" stroke="#A98CFF" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowPurple)"/>

  <rect x="440" y="285" width="94" height="32" rx="16" fill="#0F1D31"/>
  <text x="459" y="307" class="tiny">Orders</text>
  <rect x="938" y="285" width="112" height="32" rx="16" fill="#2B1C10"/>
  <text x="955" y="307" class="tiny">Confirmed</text>
  <rect x="1156" y="508" width="128" height="32" rx="16" fill="#0F1D31"/>
  <text x="1174" y="530" class="tiny">Work Order</text>
  <rect x="948" y="674" width="82" height="32" rx="16" fill="#102A2B"/>
  <text x="966" y="696" class="tiny">Ready</text>
  <rect x="594" y="508" width="120" height="32" rx="16" fill="#102A2B"/>
  <text x="611" y="530" class="tiny">Ready Ship</text>
  <rect x="846" y="508" width="90" height="32" rx="16" fill="#102A2B"/>
  <text x="863" y="530" class="tiny">Shipped</text>

  <rect x="72" y="982" width="1456" height="42" rx="12" fill="#0A1321" stroke="#223149"/>
  <line x1="98" y1="1004" x2="150" y2="1004" stroke="#5C8DFF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="164" y="1010" class="note">Order / production flow</text>
  <line x1="390" y1="1004" x2="442" y2="1004" stroke="#5EE0D0" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <text x="456" y="1010" class="note">Inventory / status update</text>
  <line x1="728" y1="1004" x2="780" y2="1004" stroke="#A98CFF" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowPurple)"/>
  <text x="794" y="1010" class="note">Shared ERP database dependency</text>
  <text x="1174" y="1010" class="note">Architecture simplified for public portfolio</text>
</svg>
